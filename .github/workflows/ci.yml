name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # From go.mod, not `stable`: the module needs a floor `stable` may not meet.
      - uses: actions/setup-go@v5
        with: {go-version-file: tui/go.mod}
      - run: cd tui && go test ./...
      - run: bash tests/integration.sh
      # shellcheck ships on the ubuntu runner only.
      - if: matrix.os == 'ubuntu-latest'
        run: make lint
